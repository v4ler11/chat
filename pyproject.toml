[project]
name = "chat"
version = "0.1.0"
description = "Typed LLM chat client library with tool-calling support"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.3",
    "fastapi>=0.115.0",
    "litellm>=1.81.11",
    "pydantic>=2.12.4",
    "starlette>=0.41.0",
]

[dependency-groups]
dev = [
    "chat",
    "ruff>=0.14.6",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.2.0",
    "pyright>=1.1.407",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.pytest.ini_options]
markers = []
testpaths = ["tests", "src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-v",
]
asyncio_mode = "auto"